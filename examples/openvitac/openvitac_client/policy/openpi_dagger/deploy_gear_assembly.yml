# DAgger collection for gear_assembly: OpenPI policy (tactile_base openvtla_gear_assembly) + scripted re-insert/turn
# when the red gear is blocked above the shaft or seated off-centre. Use task_config/gelsight_slowreset.yml on an RTX 3090.
# The `openpi` block must match the policy's evaluation config (policy/openpi/abs_joint/deploy_openvtla_gear_assembly.yml).
policy_name: openpi_dagger
seed: 0
instruction_type: seen
instuction_file: null
eval_from_start: true
eval_step_timeout_seconds: 0
eval_action_repeat: 1

openpi:
  host: "127.0.0.1"
  port: 8000
  api_key:
  websocket_ping_interval:
  websocket_ping_timeout:
  websocket_open_timeout: 10
  websocket_close_timeout: 10
  prompt: "Pick up the red gear, assemble it onto the base, and rotate it to turn the gear pair."
  prompt_from_task_instruction: false
  control_mode: "abs_joint"
  state_dim: 8
  action_dim: 8
  image_size: 224
  send_tactile: true
  tactile_image_key: rgb_marker
  tactile_history_frames: 4
  tactile_history_stride: 2
  image_color_order: "rgb"
  debug_dump_first_n_obs: 0
  open_loop_horizon: 1
  temporal_ensemble: true
  chunk_first_n: 20
  ensemble_K: 0.01
  save_trajectory: false

dagger:
  task: gear_assembly     # plugin policy/openpi_dagger/tasks/gear_assembly.py
  max_interventions: 1    # a recovery re-inserts and turns; the episode ends after it
  zone_xy: 0.006          # m, red gear this close to the shaft axis
  block_dz_min: 0.0025    # m above the assembly height: blocked range (base failures stop at ~4.6 mm)
  block_dz_max: 0.010
  stuck_window: 10        # policy steps with < stuck_progress descent in the blocked range -> takeover
  stuck_progress: 0.0003  # m
  seat_dz: 0.005          # m, |dz| below this = down on the shaft (for the off-centre check)
  off_xy: 0.0025          # m, off-centre threshold
  seated_dz: 0.002        # m, goal: seated
  regrasp_dz: 0.002       # m, settled re-insert still this high (= not seated, seated_dz) -> release (it usually slides down), re-grasp in place; insert again only if still up
  settle_steps: 30        # sim steps to let the gear settle before that check (and after releasing it)
  regrasp_lift: 0.03      # m, retreat after releasing
  expert_frame_every: 2
  wiggle_deg: [2, -2, 4, -4, 6, -6]  # still up after the re-insert: turn the held gear to these phases (tooth pitch 12 deg)
  wiggle_press: 0.0005    # ... and press it down (min(dz, 3 mm) + this) at each one
